<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VibeCheck final brand assets</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; color: #181514; background: #fff3e2; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 44px; letter-spacing: -.04em; }
      p { margin: 0; color: #786a62; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px; }
      .card { min-height: 320px; padding: 24px; border: 1px solid #dfd0c2; border-radius: 24px; background: #fffaf2; }
      .dark { color: #fff3e2; background: #181514; border-color: #332b27; }
      .hero { display: block; width: 230px; height: 230px; margin: 24px auto 0; }
      .lockup { display: block; width: min(100%, 620px); margin: 88px auto 0; }
      .sizes { display: flex; align-items: end; gap: 22px; min-height: 180px; margin-top: 32px; }
      .sizes figure { margin: 0; text-align: center; }
      .sizes figcaption { margin-top: 8px; color: #786a62; font-size: 12px; }
      .mark-dark { display: block; width: 220px; margin: 35px auto 0; padding: 18px; border-radius: 22px; background: #fff3e2; }
      @media (max-width: 800px) { body { padding: 24px; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Neighborhood Patch</h1>
    <p>Selected VibeCheck identity · full color, small sizes, and lockup.</p>
    <main class="grid">
      <section class="card">
        <strong>Primary mark</strong>
        <img class="hero" src="logo.svg" alt="VibeCheck Neighborhood Patch logo">
      </section>
      <section class="card dark">
        <strong>Transparent mark on a controlled light field</strong>
        <img class="mark-dark" src="logo-mark.svg" alt="VibeCheck cropped Neighborhood Patch mark">
      </section>
      <section class="card">
        <strong>Tiny-size proof</strong>
        <div class="sizes">
          <figure><img src="favicon-16.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
          <figure><img src="favicon-32.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
          <figure><img src="favicon-64.png" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
          <figure><img src="app-icon-128.png" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
        </div>
      </section>
      <section class="card">
        <strong>Wordmark lockup</strong>
        <img class="lockup" src="wordmark.svg" alt="VibeCheck wordmark lockup">
      </section>
    </main>
  </body>
</html>
